services:
  - type: web
    name: gd-verifications-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gd-verifications-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: gd-verifications-db
    databaseName: gd_verifications
    user: gd_verifications_user
    plan: 0.1c-256mb
